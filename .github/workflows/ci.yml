name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  qualidade:
    name: typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Checagem de tipos
        run: npm run typecheck

      - name: Testes
        run: npm test

      - name: Build de produção
        run: npm run build
        env:
          # Placeholders: o build não fala com o banco de verdade, mas as
          # variáveis precisam existir para as páginas compilarem.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key

  banco:
    name: RLS e tipos (Supabase local)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Subir Supabase local (aplica as migrações)
        # É AQUI que se prova que uma instalação NOVA funciona. Produção já tem
        # o schema montado e esconde erro de ordem entre migrações.
        run: supabase start

      - name: Isolamento entre inquilinos (RLS)
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/tests/rls_isolamento.sql

      - name: Tipos do banco reproduzíveis (schema × lib/database.types.ts)
        # Sem isto, uma tabela nova fica sem tipo e ninguém percebe até o
        # TypeScript reclamar em outro lugar, dias depois.
        run: |
          supabase gen types typescript --local | node scripts/normalizar-tipos.mjs > /tmp/database.types.gen.ts
          node scripts/normalizar-tipos.mjs < lib/database.types.ts > /tmp/database.types.atual.ts
          if ! diff -q /tmp/database.types.atual.ts /tmp/database.types.gen.ts > /dev/null; then
            diff -u /tmp/database.types.atual.ts /tmp/database.types.gen.ts | head -60 || true
            echo "::error::lib/database.types.ts diverge do schema das migrações — rode 'npm run db:types' e commite."
            exit 1
          fi
